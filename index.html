<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mis Finanzas</title>
  <meta name="description" content="Presupuesto diario, ahorro, deudas y alimentación saludable en pesos chilenos.">
  <meta name="theme-color" content="#1c7ed6">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Finanzas">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232a78d6'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3E$%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <h1><span class="logo" aria-hidden="true">$</span>Mis Finanzas</h1>
    <button type="button" class="sync-pill" data-action="sync-now" id="sync-pill" title="Sincronizar">Solo en este equipo</button>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="tabs" aria-label="Secciones">
    <button type="button" data-action="tab" data-tab="home"><span aria-hidden="true">🏠</span>Inicio</button>
    <button type="button" data-action="tab" data-tab="expenses"><span aria-hidden="true">🧾</span>Gastos</button>
    <button type="button" data-action="tab" data-tab="month"><span aria-hidden="true">📊</span>Mes</button>
    <button type="button" data-action="tab" data-tab="accounts"><span aria-hidden="true">📅</span>Cuentas</button>
    <button type="button" data-action="tab" data-tab="payslip"><span aria-hidden="true">💼</span>Sueldo</button>
    <button type="button" data-action="tab" data-tab="food"><span aria-hidden="true">🥗</span>Comida</button>
    <button type="button" data-action="tab" data-tab="more"><span aria-hidden="true">⚙️</span>Más</button>
  </nav>

  <div id="tip" class="tip" role="tooltip" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
